version: '2.1'

volumes:
  service-locks:

services:
  frontend:
    build: ./frontend
    volumes:
      - service-locks:/shared-locks
    expose:
      - "80"
  proxy:
    build: ./haproxy
    volumes:
      - service-locks:/shared-locks
    ports:
      - "80:80"
  data:
    build: ./data
    volumes:
      - service-locks:/shared-locks
    expose:
      - "8080"
